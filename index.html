<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notion Two Month Calendar</title>
  <style>
    :root{
      color-scheme: light dark;
      --page:#f7f7f5;
      --card:#ffffff;
      --text:#2f2f2f;
      --muted:#8f8f8b;
      --line:#e8e7e3;
      --hover:#f3f2ef;
      --today:#2f2f2f;
      --todayText:#fff;
      --shadow:0 2px 8px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme:dark){
      :root{
        --page:#191919;
        --card:#202020;
        --text:#f1f1ef;
        --muted:#8d8d89;
        --line:#333330;
        --hover:#2a2a2a;
        --today:#f1f1ef;
        --todayText:#191919;
        --shadow:none;
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:transparent;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    body{overflow:hidden}
    .wrap{padding:6px}
    .card{
      width:100%;
      max-width:520px;
      margin:0 auto;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:12px 14px 14px;
    }
    .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .eyebrow{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
    .nav{display:flex;gap:4px}
    .arrow{
      width:25px;height:25px;border-radius:8px;border:1px solid var(--line);
      background:var(--card);color:var(--text);font-size:16px;line-height:1;
      display:grid;place-items:center;cursor:pointer;padding:0;
    }
    .arrow:hover:not(:disabled){background:var(--hover)}
    .arrow:disabled{opacity:.28;cursor:default}
    .months{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .month-title{font-size:13px;font-weight:700;margin:0 0 7px;text-align:left}
    .dow,.days{display:grid;grid-template-columns:repeat(7,1fr)}
    .dow{margin-bottom:2px}
    .dow span{font-size:8px;font-weight:650;color:var(--muted);text-align:center;line-height:16px}
    .day{height:21px;display:grid;place-items:center;font-size:9px;color:var(--text)}
    .day.empty{visibility:hidden}
    .day span{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
    .day.today span{background:var(--today);color:var(--todayText);font-weight:700}
    @media (max-width:420px){
      .card{padding:10px 11px 12px;border-radius:16px}
      .months{gap:10px}
      .month-title{font-size:12px}
      .dow span{font-size:7px}
      .day{height:19px;font-size:8.5px}
      .day span{width:17px;height:17px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" aria-label="Two month calendar widget">
      <div class="toolbar">
        <div class="eyebrow">Calendar</div>
        <div class="nav">
          <button class="arrow" id="prevBtn" type="button" aria-label="Previous month">‹</button>
          <button class="arrow" id="nextBtn" type="button" aria-label="Next month">›</button>
        </div>
      </div>
      <section class="months" id="months"></section>
    </main>
  </div>

  <script>
    const WEEK=['S','M','T','W','T','F','S'];
    const monthName=new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'});
    const now=new Date();
    const currentStart=new Date(now.getFullYear(),now.getMonth(),1);
    let offset=0;
    const monthsEl=document.getElementById('months');
    const prevBtn=document.getElementById('prevBtn');
    const nextBtn=document.getElementById('nextBtn');

    function sameDate(a,b){
      return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    }

    function buildMonth(date){
      const y=date.getFullYear(), m=date.getMonth();
      const first=new Date(y,m,1), last=new Date(y,m+1,0);
      const leading=first.getDay(), total=last.getDate();
      const cells=Math.ceil((leading+total)/7)*7;
      const month=document.createElement('article');

      const title=document.createElement('h2');
      title.className='month-title';
      title.textContent=monthName.format(first);
      month.appendChild(title);

      const dow=document.createElement('div');
      dow.className='dow';
      WEEK.forEach(d=>{const s=document.createElement('span');s.textContent=d;dow.appendChild(s)});
      month.appendChild(dow);

      const days=document.createElement('div');
      days.className='days';
      for(let i=0;i<cells;i++){
        const d=i-leading+1;
        const cell=document.createElement('div');
        cell.className='day';
        const span=document.createElement('span');
        if(d<1 || d>total){
          cell.classList.add('empty');
          span.textContent='0';
        }else{
          const actual=new Date(y,m,d);
          span.textContent=d;
          if(sameDate(actual,now)) cell.classList.add('today');
        }
        cell.appendChild(span);
        days.appendChild(cell);
      }
      month.appendChild(days);
      return month;
    }

    function render(){
      monthsEl.innerHTML='';
      monthsEl.appendChild(buildMonth(new Date(currentStart.getFullYear(),currentStart.getMonth()+offset,1)));
      monthsEl.appendChild(buildMonth(new Date(currentStart.getFullYear(),currentStart.getMonth()+offset+1,1)));
      prevBtn.disabled = offset===0;
    }

    prevBtn.addEventListener('click',()=>{ if(offset>0){offset--;render();} });
    nextBtn.addEventListener('click',()=>{ offset++;render(); });
    render();
  </script>
</body>
</html>
